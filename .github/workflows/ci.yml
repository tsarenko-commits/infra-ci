name: CI

'on': [push]

jobs:
  check:
    calculate:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - run: python -m models.npv
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
