name: CI

on: [push]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: echo "✅ CI работает"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: Ensure models/npv.py exists
        run: test -f ${{ github.workspace }}/models/npv.py && echo "OK" || echo "MISSING"
      - run: python ${{ github.workspace }}/models/npv.py
  calculate:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - run: python -m models.npv
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
